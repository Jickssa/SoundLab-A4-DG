name: Static checks
on:
  push:
  pull_request:
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate document structure and control references
        run: python3 scripts/check_html.py
      - name: Run parser and safety regression tests
        run: node scripts/test_parsers.js
      - name: Run Elektron Sound SysEx regression tests
        run: node scripts/test_elektron_sound_sysex.js
      - name: Run IndexedDB persistence regression tests
        run: node scripts/test_persistence.js
      - name: Run audio inspector regression tests
        run: node scripts/test_audio_inspector.js
      - name: Run visual audio editor regression tests
        run: node scripts/test_visual_editor.js
      - name: Run A/B audition regression tests
        run: node scripts/test_ab_audition.js
      - name: Extract inline JavaScript and check syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/soundlab.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/soundlab.js
      - name: Build portable bundle and verify its ZIP integrity
        run: python3 scripts/package_portable.py
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: Elektron-SoundLab-v3.7-portable-${{ github.sha }}
          path: dist/Elektron-SoundLab-v3.7-portable.zip
          if-no-files-found: error
          retention-days: 30
